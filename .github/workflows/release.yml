name: Release

# Builds macOS (universal .app) and Linux binaries with the real read-only
# credentials from repository secrets.
#
# IMPORTANT: binaries contain the (obfuscated) R2 keys. This repository is
# public, so builds are attached to a DRAFT release only, which is visible to
# collaborators and not to the public. Share the files with the team
# privately; do not publish the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SURF_R2_ENDPOINT: ${{ secrets.SURF_R2_ENDPOINT }}
  SURF_R2_ACCESS_KEY_ID: ${{ secrets.SURF_R2_ACCESS_KEY_ID }}
  SURF_R2_SECRET_ACCESS_KEY: ${{ secrets.SURF_R2_SECRET_ACCESS_KEY }}
  SURF_R2_BUCKET: ${{ secrets.SURF_R2_BUCKET }}

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Optional: without these the app gets an ad-hoc signature.
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release -p surf-gui --target aarch64-apple-darwin
          cargo build --release -p surf-gui --target x86_64-apple-darwin
      - name: Import Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
      - name: Bundle universal Surf.app
        env:
          SURF_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          SURF_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          SURF_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
          SURF_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
        run: |
          packaging/macos/bundle.sh "${GITHUB_REF_NAME#v}" \
            target/aarch64-apple-darwin/release/surf \
            target/x86_64-apple-darwin/release/surf
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/Surf-macos-universal.zip
          retention-days: 1

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install GUI deps
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev
      - run: cargo build --release -p surf-gui
      - name: Package
        run: |
          mkdir -p dist/surf
          cp target/release/surf dist/surf/
          cp README.md LICENSE dist/surf/
          tar -C dist -czf dist/surf-linux-x86_64.tar.gz surf
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/surf-linux-x86_64.tar.gz
          retention-days: 1

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
