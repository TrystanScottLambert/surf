[package]
name = "surf-gui"
description = "Surf: browse, filter and download WAVES data products from R2."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "surf"
path = "src/main.rs"

[dependencies]
surf-core.workspace = true
surf-credentials.workspace = true
surf-storage.workspace = true
surf-query.workspace = true
iced.workspace = true
rfd.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
directories.workspace = true
open = "5"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }

[lints]
workspace = true
