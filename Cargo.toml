[workspace]
resolver = "3"
members = ["crates/surf-core", "crates/surf-credentials", "crates/surf-storage", "crates/surf-query", "crates/surf-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Trystan Scott Lambert"]
repository = "https://github.com/TrystanScottLambert/surf"
rust-version = "1.94"

[workspace.dependencies]
surf-core = { path = "crates/surf-core" }
surf-credentials = { path = "crates/surf-credentials" }
surf-storage = { path = "crates/surf-storage" }
surf-query = { path = "crates/surf-query" }

datafusion = { version = "55", default-features = false, features = ["parquet", "sql", "nested_expressions"] }
object_store = { version = "0.13", features = ["aws"] }
iced = { version = "0.14", features = ["markdown", "highlighter", "tokio", "advanced"] }
rfd = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
futures = "0.3"
bytes = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "6"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
# Full debug info for DataFusion makes huge binaries; line tables are enough for backtraces.
debug = "line-tables-only"

# Dependencies (DataFusion, TLS, iced) are optimised even in dev builds so
# `cargo run` without `--release` is usable; our own crates stay quick to build.
[profile.dev.package."*"]
opt-level = 3
